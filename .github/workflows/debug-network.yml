name: Debug CI Network

on:
  push:
    branches:
      - investigation/ci-network
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-checkout:
    name: A - Direct Checkout
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: block
          allowed-endpoints: |
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443

      - name: Direct checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Network diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== DNS ==="
          getent hosts github.com || true

          echo "=== HTTPS ==="
          curl --verbose --connect-timeout 10 --max-time 30 \
            https://github.com --output /dev/null || true

          echo "=== Git ==="
          timeout 30s git ls-remote \
            https://github.com/PicnicSupermarket/error-prone-support.git \
            HEAD || true

  composite-checkout:
    name: B - Composite Maven Checkout
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: block
          allowed-endpoints: |
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443

      - name: Checkout and setup Maven
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5
        with:
          checkout-fetch-depth: 2
          checkout-persist-credentials: false
          java-version: 25.0.4
          java-distribution: temurin
          maven-version: 3.9.16

      - name: Network diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== DNS ==="
          getent hosts github.com || true

          echo "=== HTTPS ==="
          curl --verbose --connect-timeout 10 --max-time 30 \
            https://github.com --output /dev/null || true

          echo "=== Git ==="
          timeout 30s git ls-remote \
            https://github.com/PicnicSupermarket/error-prone-support.git \
            HEAD || true