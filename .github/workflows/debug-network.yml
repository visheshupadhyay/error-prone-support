name: Debug CI Network

on:
  push:
    branches:
      - investigation/ci-network
  workflow_dispatch:

permissions:
  contents: read

jobs:

  hardened-block:
    name: A - Harden Runner Block
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: block
          allowed-endpoints: |
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Network diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== DNS ==="
          getent hosts github.com || true

          echo "=== HTTPS ==="
          curl -v --connect-timeout 10 --max-time 30 \
            https://github.com -o /dev/null || true

          echo "=== Git ==="
          timeout 30s git ls-remote \
            https://github.com/PicnicSupermarket/error-prone-support.git \
            HEAD || true


  hardened-audit:
    name: B - Harden Runner Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Network diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== DNS ==="
          getent hosts github.com || true

          echo "=== HTTPS ==="
          curl -v --connect-timeout 10 --max-time 30 \
            https://github.com -o /dev/null || true

          echo "=== Git ==="
          timeout 30s git ls-remote \
            https://github.com/PicnicSupermarket/error-prone-support.git \
            HEAD || true


  no-hardening:
    name: C - No Harden Runner
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Network diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== DNS ==="
          getent hosts github.com || true

          echo "=== HTTPS ==="
          curl -v --connect-timeout 10 --max-time 30 \
            https://github.com -o /dev/null || true

          echo "=== Git ==="
          timeout 30s git ls-remote \
            https://github.com/PicnicSupermarket/error-prone-support.git \
            HEAD || true